# GitHub REST API Configuration
github.base.uri=https://api.github.com
github.api.version=2022-11-28

# Personal Access Token (classic token with 'repo' and 'delete_repo' scopes, or fine-grained PAT)
# You can also supply this via environment variable GITHUB_TOKEN or JVM arg -Dgithub.token=...
github.token=

# Optional default GitHub username for tests
github.username=
